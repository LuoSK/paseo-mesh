version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      paseo:
        patterns: ["@getpaseo/*"]
      dev-tools:
        dependency-type: development
        exclude-patterns: ["@getpaseo/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
